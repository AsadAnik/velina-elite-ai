services:
  app:
    build:
      context: .
      target: ${BUILD_TARGET:-builder}
    command: ${APP_COMMAND:-pnpm run start:dev}
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - ${ENV_FILE:-.env.local}
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/velina_elite_db?schema=public
    restart: always
    depends_on:
      db:
        condition: ${DB_CONDITION:-service_healthy}

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: velina_elite_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: