services:
  # region API APP
  app:
    build:
      context: .
      target: builder
    command: sh -c "pnpm prisma migrate deploy && pnpm run start:dev"
    ports:
      - '8080:8080'
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/velina_elite_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
      - /app/node_modules
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # region PRIMARY DB PG
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: velina_elite_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # region REDIS & REDIS/STACK
  redis:
    image: redis/redis-stack:latest
    container_name: velina-redis
    restart: always
    ports:
      - '6379:6379' # Redis Server Port
      - '8001:8001' # Redis Insight Web UI
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: